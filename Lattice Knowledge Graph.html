<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lattice Knowledge Graph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: instrument console — source rail | live graph field | analysis deck. One dark HUD world, square geometry only. */
:root{
  --void:#05070B; --deck:#0A0E15; --deck-2:#101622; --rule:#1A2331; --rule-hi:#2A3850;
  --ink:#E3EBF5; --ink-2:#A6B4C8; --mute:#66758C;
  --ice:#7FD8FF; --ice-hi:#B3E9FF; --amber:#FFB547; --rose:#FF7A9A; --mint:#6FE3B4; --violet:#B39BFF; --paper:#D9E2EE; --steel:#8E9DB4;
  --danger:#FF5C6C; --on-accent:#03131B; --scrim:rgba(5,7,11,.86);
  --f-display:'Chakra Petch','Bahnschrift','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:13px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(127,216,255,.3)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule-hi)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-2)}
svg.shape{flex:none;display:block}

.app{height:100%;display:grid;grid-template-columns:284px minmax(0,1fr) 372px;grid-template-rows:auto minmax(0,1fr);gap:8px}
.top{grid-column:1/-1;grid-row:1}
.rail{grid-column:1;grid-row:2}
.stage{grid-column:2;grid-row:2}
.deck{grid-column:3;grid-row:2}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:8px 10px;background:var(--deck);border:1px solid var(--rule);min-width:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-name{font:700 17px/1 var(--f-display);letter-spacing:.24em}
.brand-sub{font:500 9.5px/1.2 var(--f-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-top:4px}
.search{position:relative;flex:1 1 260px;max-width:520px;display:flex;align-items:center;border:1px solid var(--rule-hi);background:var(--void);height:34px}
.search>svg{margin-left:10px;color:var(--mute);flex:none}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:0 10px;height:100%;font-size:13px}
.search:focus-within{border-color:var(--ice)}
kbd{font:500 10px/1.4 var(--f-mono);border:1px solid var(--rule-hi);padding:0 5px;color:var(--mute)}
.search kbd{margin-right:8px}
.top-stats{display:flex;gap:14px;font:500 10px var(--f-mono);letter-spacing:.12em;color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.top-stats b{color:var(--ink);font-weight:600;margin-left:6px}
.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.sync{font:600 9.5px var(--f-mono);letter-spacing:.14em;color:var(--mute);display:inline-flex;align-items:center;gap:7px;padding:0 8px;text-transform:uppercase;white-space:nowrap}
.sync i{width:6px;height:6px;background:var(--mute);display:block}
.sync[data-s=synced] i{background:var(--mint)}
.sync[data-s=saving] i,.sync[data-s=loading] i{background:var(--amber);animation:blink 1s steps(2) infinite}
.sync[data-s=local] i{background:var(--ice)}
.sync[data-s=full] i{background:var(--danger)}
@keyframes blink{50%{opacity:.2}}

/* panels */
.panel{background:var(--deck);border:1px solid var(--rule);min-height:0;min-width:0;display:flex;flex-direction:column}
.rail{overflow:auto}
.sec{padding:12px 12px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec.grow{flex:1;min-height:170px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);min-height:20px}
.sec-h>span:first-child{display:inline-flex;align-items:center;gap:8px}
.sec-h>span:first-child::before{content:"";width:6px;height:6px;background:var(--ice);display:block}
.meta{font:500 10px var(--f-mono);color:var(--mute);letter-spacing:.08em}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 11px;background:var(--deck-2);border:1px solid var(--rule-hi);color:var(--ink);font:500 12px/1 var(--f-body);white-space:nowrap;transition:border-color .12s,background-color .12s,color .12s}
.btn:hover{border-color:var(--ice)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--rule-hi)}
.btn.sm{height:26px;padding:0 8px;font-size:11.5px;gap:6px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:26px}
.btn.primary{background:var(--ice);border-color:var(--ice);color:var(--on-accent);font-weight:600;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%);padding-right:15px}
.btn.primary:hover{background:var(--ice-hi);border-color:var(--ice-hi)}
.btn.primary:focus-visible{outline:2px solid var(--on-accent);outline-offset:-4px}
.btn.ai{border-color:rgba(127,216,255,.45);color:var(--ice)}
.btn.ai:hover{background:rgba(127,216,255,.08)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--rule-hi)}
.btn[aria-pressed=true]{border-color:var(--ice);color:var(--ice)}
:focus-visible{outline:1px solid var(--ice);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--ice);font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.link:hover{color:var(--ice-hi)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inp,.sel{height:34px;background:var(--void);border:1px solid var(--rule-hi);padding:0 10px;outline:0;width:100%;min-width:0}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--ice)}
.sel{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(-45deg,transparent 50%,var(--ink-2) 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.ta{width:100%;background:var(--void);border:1px solid var(--rule-hi);padding:8px 10px;outline:0;font:13px/1.5 var(--f-body);resize:vertical}
.lbl{font:600 9.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:6px}
.lbl-row{display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1px;background:var(--rule-hi);border:1px solid var(--rule-hi)}
.seg button{background:var(--deck);border:0;height:27px;font:500 11px var(--f-body);color:var(--ink-2);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ice);color:var(--on-accent);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;width:100%;min-width:0;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule-hi)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:14px;background:var(--ice);margin-top:-6px;border:0}
input[type=range]::-moz-range-track{height:2px;background:var(--rule-hi)}
input[type=range]::-moz-range-thumb{width:10px;height:14px;background:var(--ice);border:0}
.types{display:flex;flex-wrap:wrap;gap:4px}
.tchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border:1px solid var(--rule-hi);background:transparent;font:500 11px var(--f-body);color:var(--ink)}
.tchip:hover{border-color:var(--ice)}
.tchip .cnt{color:var(--mute);font:500 10px var(--f-mono)}
.tchip[aria-pressed=false]{opacity:.4}
.tchip[aria-pressed=false] span:not(.cnt){text-decoration:line-through}

/* sources */
.drop{border:1px dashed var(--rule-hi);padding:14px 12px;display:flex;flex-direction:column;gap:8px;background-color:transparent;background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(127,216,255,.03) 9px 10px);transition:border-color .15s,background-color .15s}
.drop.over{border-color:var(--ice);background-color:rgba(127,216,255,.06)}
.drop-t{font:600 13px/1.35 var(--f-body)}
.drop-s{font:500 9.5px var(--f-mono);color:var(--mute);letter-spacing:.06em}
.note{font-size:11.5px;line-height:1.5;color:var(--ink-2);border:1px solid var(--rule-hi);padding:8px 10px;background:var(--void)}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.docs:empty{display:none}
.doc{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:9px;align-items:start;padding:8px;background:var(--deck)}
.doc:hover{background:var(--deck-2)}
.doc>svg{margin-top:2px}
.doc-title{font:500 12.5px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;text-align:left;width:100%;display:block;color:var(--ink)}
.doc-title:hover{color:var(--ice)}
.doc-meta{font:500 9.5px/1.4 var(--f-mono);color:var(--mute);letter-spacing:.05em;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.doc-acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.doc:hover .doc-acts,.doc:focus-within .doc-acts{opacity:1}
@media (hover:none){.doc-acts{opacity:1}}
.chip{font:600 8.5px/1 var(--f-mono);letter-spacing:.12em;padding:3px 5px;border:1px solid currentColor;text-transform:uppercase;white-space:nowrap}
.chip.run{color:var(--ice);background-image:repeating-linear-gradient(90deg,rgba(127,216,255,.2) 0 6px,transparent 6px 12px);background-size:24px 100%;animation:march .8s linear infinite}
.chip.ok{color:var(--mint)} .chip.err{color:var(--danger)} .chip.dim{color:var(--steel)} .chip.warn{color:var(--amber)}
@keyframes march{to{background-position:24px 0}}
.log{list-style:none;margin:0;padding:0;font:400 10.5px/1.6 var(--f-mono);color:var(--ink-2);overflow:auto;flex:1;min-height:90px}
.log li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:6px}
.log li span{overflow-wrap:anywhere}
.log time{color:var(--mute)}
.log .err span{color:var(--danger)} .log .ok span{color:var(--mint)} .log .warn span{color:var(--amber)}

/* stage */
.stage{position:relative;overflow:hidden;background:var(--void);border:1px solid var(--rule);min-height:0;min-width:0}
#cv{position:absolute;inset:0;display:block;touch-action:none;cursor:grab}
.crn{position:absolute;width:14px;height:14px;border:0 solid var(--ice);pointer-events:none;opacity:.75;z-index:2}
.crn.a{top:5px;left:5px;border-width:1px 0 0 1px}.crn.b{top:5px;right:5px;border-width:1px 1px 0 0}.crn.c{bottom:5px;left:5px;border-width:0 0 1px 1px}.crn.d{bottom:5px;right:5px;border-width:0 1px 1px 0}
.ov-tl{position:absolute;top:14px;left:16px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:3;max-width:calc(100% - 230px)}
.banner,.focusbar{display:flex;align-items:center;gap:10px;background:var(--scrim);border:1px solid var(--rule-hi);padding:4px 4px 4px 10px;font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);max-width:100%;flex-wrap:wrap}
.banner .dot{width:6px;height:6px;background:var(--amber);display:block;flex:none}
.focusbar b{color:var(--ink);font:600 12px var(--f-display);letter-spacing:.02em;text-transform:none}
.focusbar .seg{--n:2;min-width:120px}
.legend{position:absolute;top:12px;right:14px;z-index:3;background:var(--scrim);border:1px solid var(--rule);padding:8px 10px;display:grid;gap:5px;font:500 10.5px var(--f-mono);color:var(--ink-2);min-width:150px;max-width:220px}
.legend .lg-h{font:600 9px var(--f-mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin-bottom:2px}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:7px;align-items:center}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.lg i{width:9px;height:9px;display:block;justify-self:center}
.ov-bl{position:absolute;left:14px;bottom:14px;z-index:3;display:flex;flex-direction:column;gap:6px;width:min(440px,calc(100% - 230px))}
.readout{font:500 9.5px var(--f-mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap}
.readout b{color:var(--ink-2);font-weight:500}
.readout .live{color:var(--mint)} .readout .frozen{color:var(--amber)}
.timeline{display:flex;align-items:center;gap:10px;background:var(--scrim);border:1px solid var(--rule);padding:5px 10px 5px 5px}
.timeline .tl-l{font:500 10px var(--f-mono);color:var(--ink-2);letter-spacing:.06em;white-space:nowrap;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.ov-br{position:absolute;right:14px;bottom:14px;z-index:3;display:flex;align-items:flex-end;gap:6px}
.zoomctl{display:flex;flex-direction:column;gap:4px}
.zoomctl .btn{background:var(--scrim)}
#mini{width:176px;height:112px;display:block;border:1px solid var(--rule-hi);background:var(--scrim);cursor:crosshair;touch-action:none}
#legendBtn{display:none}
.tip{position:absolute;pointer-events:none;max-width:280px;background:rgba(5,7,11,.95);border:1px solid var(--rule-hi);padding:8px 10px;font-size:12px;z-index:5}
.tip .t{font:600 13.5px/1.25 var(--f-display)}
.tip .m{font:500 9px var(--f-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin:3px 0 5px;display:flex;gap:8px}
.tip p{margin:0;color:var(--ink-2);line-height:1.45}
.empty{position:absolute;inset:0;display:grid;place-items:center;z-index:4;padding:24px;pointer-events:none}
.empty>div{pointer-events:auto;max-width:430px;text-align:left;background:var(--scrim);border:1px solid var(--rule-hi);padding:22px;display:flex;flex-direction:column;gap:12px}
.empty h2{margin:0;font:600 22px/1.15 var(--f-display);text-wrap:balance}
.empty p{margin:0;color:var(--ink-2);line-height:1.55}
.dropveil{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(5,7,11,.8);border:1px dashed var(--ice);pointer-events:none;overflow:hidden}
.dropveil::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ice);box-shadow:0 0 18px var(--ice);animation:scan 1.6s linear infinite}
.dropveil div{font:600 20px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ice)}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(100vh)}}
.ctxmenu{position:absolute;z-index:9;min-width:200px;background:var(--deck-2);border:1px solid var(--rule-hi);padding:4px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ctxmenu .head{font:600 9.5px var(--f-mono);letter-spacing:.12em;padding:6px 8px 8px;color:var(--mute);border-bottom:1px solid var(--rule);margin-bottom:4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.ctxmenu button{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;background:transparent;border:0;text-align:left;font-size:12.5px;color:var(--ink)}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:var(--rule)}
.ctxmenu button.danger{color:var(--danger)}
.fatal{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:var(--danger);font:500 13px var(--f-mono);text-align:center}

/* deck */
.deck{overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule);flex:none}
.tab{height:40px;background:transparent;border:0;border-right:1px solid var(--rule);font:600 10px var(--f-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;position:relative;display:flex;align-items:center;justify-content:center;gap:6px}
.tab:last-child{border-right:0}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected=true]{color:var(--ink);background:var(--deck-2)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ice)}
.tab kbd{font-size:8.5px;padding:0 3px;line-height:1.3}
.pane{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.pane.ask{padding:0;gap:0;overflow:hidden}
.kicker{display:flex;align-items:center;gap:8px;font:600 9.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);flex-wrap:wrap}
.kicker .sep{color:var(--rule-hi)}
.i-title{font:600 23px/1.15 var(--f-display);letter-spacing:.005em;margin:8px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.i-title-row{display:flex;align-items:flex-start;gap:6px}
.i-title-row .btn{margin-top:10px}
.aliases{font:400 11px/1.5 var(--f-mono);color:var(--mute);margin-top:4px;overflow-wrap:anywhere}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.metrics.m3{grid-template-columns:repeat(3,minmax(0,1fr))}
.metric{background:var(--deck);padding:8px 9px;min-width:0}
.metric b{display:block;font:600 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric span{font:500 8.5px var(--f-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.summary{margin:0;font-size:13.5px;line-height:1.6;max-width:65ch}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.sub-h{font:600 9.5px var(--f-mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.conn{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.conn button{width:100%;display:grid;grid-template-columns:auto 12px minmax(0,1fr);gap:8px;align-items:center;padding:6px 4px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;font-size:12.5px;color:var(--ink)}
.conn button:hover{background:var(--deck-2)}
.conn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel{font:500 9.5px var(--f-mono);color:var(--ink-2);letter-spacing:.03em;white-space:nowrap;min-width:92px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.rel.in{color:var(--mute)}
.ev{display:flex;flex-direction:column;gap:8px}
.ev blockquote{margin:0;padding:8px 10px;border:1px solid var(--rule);background:var(--void);font-size:12px;color:var(--ink-2);line-height:1.6}
.ev cite{display:block;font:500 9px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-style:normal;margin-bottom:4px}
mark{background:rgba(127,216,255,.2);color:var(--ink);padding:0 1px}
.ai-out{border:1px solid rgba(127,216,255,.3);background-color:var(--void);background-image:linear-gradient(180deg,rgba(127,216,255,.05),transparent 120px);padding:10px 12px;font-size:13px;line-height:1.6}
.ai-h{font:600 9.5px var(--f-mono);letter-spacing:.14em;color:var(--ice);text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:8px;justify-content:space-between}
.ai-h>span{display:flex;gap:7px;align-items:center}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md ul{margin:0 0 8px;padding-left:16px}
.md li{margin:3px 0}
.md li::marker{color:var(--ice);content:"■  ";font-size:7px}
.md h4{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ice);margin:12px 0 5px}
.md h4:first-child{margin-top:0}
.md code{font:12px var(--f-mono);background:var(--deck-2);padding:0 3px}
.md strong{color:var(--ink);font-weight:600}
.nchip{display:inline-flex;align-items:center;gap:4px;padding:0 5px;border:1px solid var(--rule-hi);background:var(--deck-2);font:500 12px/1.55 var(--f-body);color:var(--ink);vertical-align:baseline;margin:0 1px}
.nchip:hover{border-color:var(--ice)}
.nchip.ghost{border-style:dashed;color:var(--ink-2);cursor:default}
.srcref{font:500 10.5px var(--f-mono);color:var(--paper);border-bottom:1px dotted var(--steel)}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--mute);font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.thinking i{width:5px;height:5px;background:var(--ice);display:block;animation:blink 1s steps(2) infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
.hubs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.hubs button{width:100%;display:grid;grid-template-columns:12px minmax(0,1fr) 70px 24px;gap:8px;align-items:center;padding:5px 4px;background:transparent;border:0;text-align:left;color:var(--ink);font-size:12.5px}
.hubs button:hover{background:var(--deck-2)}
.hubs .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hubs .n{font:500 10px var(--f-mono);color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--rule);display:block}
.bar i{display:block;height:100%;background:var(--ice)}
.tips{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;color:var(--ink-2);margin:0}
.tips dt{font:500 10px var(--f-mono);color:var(--ink);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tips dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}

/* ask */
.ask-log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.ask-intro h3{margin:0 0 6px;font:600 18px/1.2 var(--f-display)}
.ask-intro p{margin:0;color:var(--ink-2);font-size:12.5px;line-height:1.55}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sugg button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--rule-hi);background:transparent;font-size:12.5px;color:var(--ink)}
.sugg button:hover{border-color:var(--ice);background:var(--deck-2)}
.sugg svg{color:var(--ice);flex:none}
.msg{display:flex;flex-direction:column;gap:5px;min-width:0}
.msg .who{font:600 9px var(--f-mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.msg.user{align-items:flex-end}
.msg.user .body{background:var(--deck-2);border:1px solid var(--rule-hi);padding:8px 10px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .body{border-left:2px solid var(--ice);padding:2px 0 2px 12px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.msg .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:500 9.5px var(--f-mono);color:var(--mute);letter-spacing:.06em}
.msg .err{color:var(--danger);font-size:12px}
.ask-form{border-top:1px solid var(--rule);padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;flex:none}
.ask-form .ta{resize:none;height:62px}
.ask-btns{display:flex;flex-direction:column;gap:6px}
.partial{color:var(--mute);font-style:italic;font-size:12px;grid-column:1/-1}

/* path + insights */
.pfield{position:relative}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:20;background:var(--deck-2);border:1px solid var(--rule-hi);display:flex;flex-direction:column;max-height:300px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.dd-item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 10px;background:transparent;border:0;text-align:left;color:var(--ink);font-size:12.5px}
.dd-item.on,.dd-item:hover{background:var(--rule)}
.dd-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-m{font:500 9px var(--f-mono);color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chain li.node button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;background:var(--deck-2);border:1px solid var(--rule-hi);text-align:left;font-size:13px;color:var(--ink)}
.chain li.node button:hover{border-color:var(--ice)}
.chain li.hop{font:500 10px var(--f-mono);color:var(--ink-2);padding:5px 0 5px 14px;border-left:1px solid var(--ice);margin-left:14px;letter-spacing:.04em}
.card{border:1px solid var(--rule);background:var(--deck-2);padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.card .t{font-size:13px;line-height:1.45;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .why{font-size:12px;color:var(--ink-2);line-height:1.5}
.card .rel{min-width:0}
.conf{font:500 9.5px var(--f-mono);color:var(--mute)}
.ai-tools{display:grid;grid-template-columns:1fr;gap:6px}
.ai-tools .btn{justify-content:flex-start;height:36px}
.ai-tools .btn small{margin-left:auto;font:500 9.5px var(--f-mono);color:var(--mute);letter-spacing:.06em}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.clist button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:start;width:100%;padding:8px 9px;background:var(--deck);border:0;text-align:left;color:var(--ink)}
.clist button:hover{background:var(--deck-2)}
.clist i{width:9px;height:9px;display:block;margin-top:4px}
.clist .nm{font-size:12.5px;font-weight:500}
.clist .mem{font-size:11px;color:var(--mute);line-height:1.45;margin-top:2px}
.clist .n{font:500 10px var(--f-mono);color:var(--mute)}
.cov{display:flex;flex-direction:column;gap:7px}
.cov div{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 8px;align-items:center;font-size:11.5px}
.cov span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.cov b{font:500 10px var(--f-mono);color:var(--mute);text-align:right;font-weight:500}
.cov .bar{grid-column:1/-1}

/* modal + toasts */
.modal{position:fixed;inset:0;background:rgba(2,3,6,.74);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--deck);border:1px solid var(--rule-hi);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dialog-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.dialog-h h3{margin:0;font:600 17px var(--f-display);letter-spacing:.03em}
.dialog-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.dialog-b p{margin:0;color:var(--ink-2);line-height:1.55}
.dialog-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--rule);flex-wrap:wrap}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--rule-hi);background:var(--deck-2);text-align:left;width:100%;color:var(--ink)}
.opt:hover{border-color:var(--ice)}
.opt .oi{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--rule-hi);color:var(--ice)}
.opt b{display:block;font-weight:600;font-size:13px}
.opt span{font-size:11.5px;color:var(--ink-2)}
.opt em{font:500 9.5px var(--f-mono);color:var(--mute);font-style:normal;letter-spacing:.08em}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.steps li{background:var(--deck-2);padding:9px 10px;font-size:11.5px;color:var(--ink-2);line-height:1.45}
.steps b{display:block;font:600 9.5px var(--f-mono);letter-spacing:.12em;color:var(--ice);text-transform:uppercase;margin-bottom:3px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:12px;color:var(--ink-2)}
.keys div{display:flex;gap:10px;align-items:center}
.keys kbd{min-width:40px;text-align:center;color:var(--ink)}
.toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:min(460px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--deck-2);border:1px solid var(--rule-hi);padding:9px 10px 9px 12px;font-size:12.5px;line-height:1.4;animation:tin .18s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.toast::before{content:"";width:7px;height:7px;background:var(--ice);flex:none}
.toast.error::before{background:var(--danger)} .toast.ok::before{background:var(--mint)}
.toast .btn{margin-left:auto}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}

@media (max-width:1240px){.app{grid-template-columns:258px minmax(0,1fr) 336px}.top-stats{display:none}.tab kbd{display:none}}
@media (max-width:960px){
  html,body{height:auto}
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .top,.rail,.stage,.deck{grid-column:1;grid-row:auto}
  .stage{order:1;height:66vh;min-height:380px}
  .deck{order:2;overflow:visible}
  .rail{order:3;overflow:visible}
  .pane{overflow:visible}
  .pane.ask{overflow:hidden}
  .ask-log{max-height:440px;min-height:260px}
  .log{max-height:240px}
}
@media (max-width:680px){
  .search{order:3;flex-basis:100%;max-width:none}
  .brand-sub{display:none}
  .top-actions .hide-sm{display:none}
  #mini{display:none}
  .legend{display:none;top:auto;bottom:96px;right:50px}
  .legend.open{display:grid}
  #legendBtn{display:inline-flex}
  .ov-bl{width:calc(100% - 28px);bottom:14px}
  .ov-br{bottom:96px}
  .ov-tl{max-width:calc(100% - 32px)}
  .steps{grid-template-columns:1fr}
  .keys{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div class="app" id="app">

        <rect x="2.5" y="2.5" width="5" height="5" fill="var(--void)"/><rect x="12.5" y="2.5" width="5" height="5" fill="var(--void)" stroke="var(--amber)"/><rect x="22.5" y="2.5" width="5" height="5" fill="var(--void)"/>
        <rect x="2.5" y="12.5" width="5" height="5" fill="var(--void)" stroke="var(--rose)"/><rect x="11.5" y="11.5" width="7" height="7" fill="var(--ice)"/><rect x="22.5" y="12.5" width="5" height="5" fill="var(--void)" stroke="var(--mint)"/>
        <rect x="2.5" y="22.5" width="5" height="5" fill="var(--void)"/><rect x="12.5" y="22.5" width="5" height="5" fill="var(--void)" stroke="var(--violet)"/><rect x="22.5" y="22.5" width="5" height="5" fill="var(--void)"/>

['d1','Attention Is All You Need','paper','2026-10-02','Introduces the Transformer, a translation model built only from attention. It drops recurrence, trains far faster, and set new BLEU records on WMT 2014.',
`Reading notes. The paper introduces the Transformer, a sequence-to-sequence model that drops recurrence and convolution and relies entirely on attention. The encoder-decoder architecture stacks six identical layers on each side. Each layer combines multi-head attention with a position-wise feed-forward network, wrapped in residual connections and layer normalization.

Scaled dot-product attention computes weights from queries and keys, divided by the square root of the key dimension so the softmax does not saturate. Multi-head attention runs several of these in parallel so the model can attend to different representation subspaces at once.

Because self-attention has no notion of order, the authors add sinusoidal positional encodings to the input embeddings. Compared with recurrent neural networks, every position can attend to every other in a constant number of steps, which makes training far more parallel.

Evaluated on WMT 2014 English-German and English-French machine translation, the model reached state-of-the-art BLEU at a fraction of the training cost. Lead author: Ashish Vaswani.`],
['d3','BERT: Pre-training of Deep Bidirectional Transformers','paper','2026-10-09','Shows that an encoder-only Transformer pre-trained with masked language modeling transfers to many language tasks after light fine-tuning.',
`BERT is an encoder-only Transformer pre-trained on unlabeled text and then fine-tuned for downstream tasks, a clear case of transfer learning in natural language processing.

Two pre-training objectives: masked language modeling, where about 15% of WordPiece tokens are hidden and predicted from both left and right context, and next sentence prediction, which asks whether two segments follow each other. Bidirectional self-attention is the key difference from left-to-right language models.

Fine-tuning adds a small task head and updates all weights. The paper reported large gains on the GLUE benchmark and on question answering. The contextual vector embeddings BERT produces became a default building block for retrieval and classification. First author: Jacob Devlin.`],
['d2','Notes — Retrieval-Augmented Generation','notes','2026-10-16','Working notes on grounding language models with retrieved passages: the pipeline, why it reduces hallucination, and where knowledge graphs might help.',
`Retrieval-augmented generation (RAG) pairs a large language model with a retriever so answers are grounded in external documents instead of only the model's parameters. The original formulation by Patrick Lewis and colleagues used dense passage retrieval with a BERT-based encoder for queries and passages.

Pipeline I keep coming back to: chunk documents, embed each chunk as a vector embedding, store in an index, retrieve top-k with approximate nearest neighbor search, optionally rerank with a cross-encoder, then pass the passages to the generator.

Why it matters: it reduces hallucination and lets the knowledge base change without retraining. Chunking strategy has a surprisingly large effect: chunks too small lose context, too large dilute relevance. Reranking usually beats increasing k.

Open thought: a knowledge graph could complement vector search by giving explicit relations between entities, useful for multi-hop question answering.`],
['d4','Lecture notes — Graph Neural Networks','notes','2026-10-23','Lecture notes on message passing, GCNs and GATs, the over-smoothing problem, and how GNNs relate to knowledge graphs.',
`Graph neural networks learn on graph-structured data through message passing: each node aggregates features from its neighbors and updates its own representation, layer by layer. The output is a node embedding that captures local structure.

Graph convolutional networks (Thomas Kipf) use a normalized neighborhood average. Graph attention networks (Petar Veličković) instead learn attention weights over neighbors, which is self-attention restricted to the graph's edges.

Connection to knowledge graphs: GNNs can model entities and relations directly, which is the backbone of much of graph representation learning.`],

`Jared Kaplan and colleagues found that the cross-entropy loss of Transformer language models falls as a power law in model parameters, dataset size, and training compute, across several orders of magnitude.

Practical upshot: performance is predictable, so you can plan compute-optimal training runs by deciding how to split a fixed budget between model size and data. The paper argued for larger models trained on relatively less data; later work revised the ratio toward more data.

Scaling laws describe smooth improvement in loss. Emergent abilities, by contrast, are capabilities that seem to appear suddenly in large language models above some scale, which is still debated.`],
['d6','Reading log — Vector databases','notes','2026-11-06','Notes on how vector databases store embeddings and serve similarity search with HNSW, FAISS and product quantization.',
`A vector database stores vector embeddings and answers similarity queries quickly. Most rank results by cosine similarity or dot product.

  IDX.byId.clear();IDX.byKey.clear();IDX.pair.clear();IDX.doc.clear();
  for(const d of S.docs)IDX.doc.set(d.id,d);
  for(const n of S.nodes)indexNode(n);
  S.edges=S.edges.filter(e=>IDX.byId.has(e.s)&&IDX.byId.has(e.t)&&e.s!==e.t);
  for(const e of S.edges)IDX.pair.set(pairKey(e.s,e.t),e);
}
function derive(){
  D.ver++;D.deg.clear();D.adj.clear();D.docDeg.clear();D.docIndex.clear();
  S.docs.forEach((d,i)=>{D.docIndex.set(d.id,i);D.docDeg.set('doc:'+d.id,0);});
  for(const n of S.nodes){D.deg.set(n.id,0);D.adj.set(n.id,[]);for(const did of n.docs||[]){const k='doc:'+did;if(D.docDeg.has(k))D.docDeg.set(k,D.docDeg.get(k)+1);}}
  for(const e of S.edges){D.adj.get(e.s).push({o:e.t,e,out:true});D.adj.get(e.t).push({o:e.s,e,out:false});D.deg.set(e.s,D.deg.get(e.s)+1);D.deg.set(e.t,D.deg.get(e.t)+1);}
  const ds=[...D.deg.values()].sort((a,b)=>b-a);
  D.maxDeg=Math.max(1,ds[0]||1);D.labelDeg=Math.max(2,ds[Math.floor(ds.length*0.28)]??0);
  louvain();
}
function louvain(){
  const ids=S.nodes.map(n=>n.id);const N=ids.length;const ix=new Map(ids.map((id,i)=>[id,i]));
  let adj=Array.from({length:N},()=>new Map());let kArr=new Array(N).fill(0);let m2=0;
  for(const e of S.edges){const a=ix.get(e.s),b=ix.get(e.t);if(a==null||b==null||a===b)continue;const w=e.w||1;adj[a].set(b,(adj[a].get(b)||0)+w);adj[b].set(a,(adj[b].get(a)||0)+w);kArr[a]+=w;kArr[b]+=w;m2+=2*w;}
  let member=ids.map((_,i)=>i);
  if(m2>0){
    for(let level=0;level<8;level++){
      const n=adj.length;const comm=Array.from({length:n},(_,i)=>i);const tot=kArr.slice();
      const order=[...Array(n).keys()].sort((a,b)=>hash(a+'x'+level)-hash(b+'x'+level));
      let movedAny=false;
      for(let pass=0;pass<30;pass++){
        let moved=0;
        for(const i of order){
          const ki=kArr[i];if(!ki)continue;const ci=comm[i];const w=new Map();
          for(const[j,wij]of adj[i]){const c=comm[j];w.set(c,(w.get(c)||0)+wij);}
          tot[ci]-=ki;let best=ci,bg=(w.get(ci)||0)-tot[ci]*ki/m2;
          for(const[c,wc]of w){const g=wc-tot[c]*ki/m2;if(g>bg+1e-12){bg=g;best=c;}}
          tot[best]+=ki;if(best!==ci){comm[i]=best;moved++;}
        }
        if(!moved)break;movedAny=true;
      }
      if(!movedAny)break;
      const remap=new Map();comm.forEach(c=>{if(!remap.has(c))remap.set(c,remap.size);});
      const nn=remap.size;const nadj=Array.from({length:nn},()=>new Map());const nk=new Array(nn).fill(0);
      for(let i=0;i<n;i++){const ci=remap.get(comm[i]);nk[ci]+=kArr[i];for(const[j,w]of adj[i]){const cj=remap.get(comm[j]);if(ci!==cj)nadj[ci].set(cj,(nadj[ci].get(cj)||0)+w);}}
      member=member.map(m=>remap.get(comm[m]));adj=nadj;kArr=nk;
      if(nn===n)break;
    }
  }
  const groups=new Map();ids.forEach((id,i)=>{const c=member[i];if(!groups.has(c))groups.set(c,[]);groups.get(c).push(id);});
  const list=[...groups.values()].map(m=>m.sort((a,b)=>D.deg.get(b)-D.deg.get(a))).sort((a,b)=>b.length-a.length||(D.deg.get(b[0])-D.deg.get(a[0])));
  D.comm.clear();D.commList=[];let ci=0;
  list.forEach((members,i)=>{const big=members.length>1;const c={i,members,name:IDX.byId.get(members[0])?.label||'—',color:big?pal(ci++):C.mute,big};D.commList.push(c);for(const id of members)D.comm.set(id,i);});
}
function betweenness(){
  if(D.btwVer===D.ver)return D.btw;
  const ids=S.nodes.map(n=>n.id);const CB=new Map(ids.map(i=>[i,0]));
  const sources=ids.length>900?ids.filter((_,i)=>i%Math.ceil(ids.length/400)===0):ids;
  for(const s of sources){
    const stack=[],P=new Map(),sigma=new Map(),dist=new Map();
    sigma.set(s,1);dist.set(s,0);const Q=[s];let qi=0;
    while(qi<Q.length){const v=Q[qi++];stack.push(v);for(const a of D.adj.get(v)){const w=a.o;if(!dist.has(w)){dist.set(w,dist.get(v)+1);Q.push(w);}if(dist.get(w)===dist.get(v)+1){sigma.set(w,(sigma.get(w)||0)+sigma.get(v));if(!P.has(w))P.set(w,[]);P.get(w).push(v);}}}
    const delta=new Map();
    while(stack.length){const w=stack.pop();for(const v of P.get(w)||[])delta.set(v,(delta.get(v)||0)+sigma.get(v)/sigma.get(w)*(1+(delta.get(w)||0)));if(w!==s)CB.set(w,CB.get(w)+(delta.get(w)||0));}
  }
  D.btw=CB;D.btwVer=D.ver;return CB;
}

const DOCN=new Map();
function docNode(d){let n=DOCN.get(d.id);if(!n){n={id:'doc:'+d.id,docId:d.id,type:'source',x:num(d.x)??(Math.random()-.5)*300,y:num(d.y)??(Math.random()-.5)*300};DOCN.set(d.id,n);}n.label=d.title;n.t=d.addedAt;return n;}
function nodeById(id){if(!id)return null;if(id.startsWith('doc:')){const d=IDX.doc.get(id.slice(4));return d?docNode(d):null;}return IDX.byId.get(id)||null;}
const degOf=n=>n.type==='source'?(D.docDeg.get(n.id)||0):(D.deg.get(n.id)||0);
function nodeR(n){if(n.type==='source')return 10;return 4.5+Math.min(13,Math.sqrt(D.deg.get(n.id)||0)*2.5)+(n.type==='field'?2:0);}
function colorOf(n){
  if(G.colorBy==='cluster'&&n.type!=='source'){const c=D.commList[D.comm.get(n.id)];return c?c.color:C.mute;}
  if(G.colorBy==='source'){if(n.type==='source')return pal(D.docIndex.get(n.docId)??0);const d=n.docs&&n.docs[0];return d!=null&&D.docIndex.has(d)?pal(D.docIndex.get(d)):C.mute;}
  return TYPES[n.type]?.c||C.ink;
}

const sim=d3.forceSimulation().alphaDecay(0.026).velocityDecay(0.4)
  .force('link',d3.forceLink().id(d=>d.id))
  .force('charge',d3.forceManyBody().distanceMax(560).theta(0.85))
  .force('collide',d3.forceCollide())
  .force('x',d3.forceX(0).strength(0.035))
  .force('y',d3.forceY(0).strength(0.035))
  .on('tick',()=>{G.dirty=true;})
  .on('end',()=>{if(S&&!S.pristine)scheduleSave();});

const RING={field:70,concept:180,method:260,artifact:330,person:400,gap:450,source:540};
function timeX(t){const b=tlBounds();if(!b||b.max===b.min)return 0;return -440+880*((t||b.min)-b.min)/(b.max-b.min);}
function applyForces(){
  const lc=G.lc;
  sim.force('link').links(G.links)
    .distance(l=>l.mention?95:36+8*Math.sqrt(Math.min(degOf(l.source),degOf(l.target))))
    .strength(l=>l.mention?0.03:0.7/Math.max(1,Math.min(lc.get(l.source.id)||1,lc.get(l.target.id)||1)));
  const L=G.layout;
  sim.force('charge').strength(n=>n.type==='source'?-300:-(100+28*Math.sqrt(D.deg.get(n.id)||0))*(L==='radial'?0.5:1));
  sim.force('collide').radius(n=>nodeR(n)+7).strength(0.85);
  sim.force('radial',null);
  if(L==='clusters'){
    const big=D.commList.filter(c=>c.big);const R=90+42*Math.sqrt(big.length)*Math.sqrt(Math.max(1,S.nodes.length/40));const anchors=new Map();
    big.forEach((c,i)=>{const a=i/big.length*Math.PI*2-Math.PI/2;const r=big.length===1?0:R*(i%2?0.78:1);anchors.set(c.i,{x:Math.cos(a)*r,y:Math.sin(a)*r});});
    const outer=R+180;
    const anchorOf=n=>{if(n.type==='source'){const counts=new Map();for(const m of S.nodes)if(m.docs.includes(n.docId)){const c=D.comm.get(m.id);counts.set(c,(counts.get(c)||0)+1);}let best=null,bv=-1;for(const[c,v]of counts)if(v>bv&&anchors.has(c)){bv=v;best=c;}const a=anchors.get(best)||{x:0,y:0};const len=Math.hypot(a.x,a.y)||1;return{x:a.x/len*(len+150),y:a.y/len*(len+150)};}
      const c=D.comm.get(n.id);if(anchors.has(c))return anchors.get(c);const a=(hash(n.id)%360)*Math.PI/180;return{x:Math.cos(a)*outer,y:Math.sin(a)*outer};};
    const cache=new Map();const get=n=>{let v=cache.get(n.id);if(!v){v=anchorOf(n);cache.set(n.id,v);}return v;};
    sim.force('x').x(n=>get(n).x).strength(0.16);sim.force('y').y(n=>get(n).y).strength(0.16);
  }else if(L==='radial'){
    sim.force('x').x(0).strength(0.01);sim.force('y').y(0).strength(0.01);
    sim.force('radial',d3.forceRadial(n=>RING[n.type]||300,0,0).strength(0.75));
  }else if(L==='timeline'){
    sim.force('x').x(n=>timeX(n.t)).strength(0.55);sim.force('y').y(0).strength(0.04);
  }else{
    sim.force('x').x(0).strength(0.035);sim.force('y').y(0).strength(0.035);
  }
}
function focusSet(n,hops){
  const set=new Set([n.id]);
  if(n.type==='source'){for(const m of S.nodes)if(m.docs.includes(n.docId))set.add(m.id);return set;}
  let frontier=[n.id];
  for(let i=0;i<hops;i++){const nx=[];for(const id of frontier)for(const a of D.adj.get(id)||[])if(!set.has(a.o)){set.add(a.o);nx.push(a.o);}frontier=nx;}
  for(const d of n.docs||[])set.add('doc:'+d);
  return set;
}
function computeVisible(){
  const out=[],cut=G.timeCut;const fs=G.focus?focusSet(G.focus,G.focusHops):null;
  for(const n of S.nodes){if(!G.typeOn[n.type])continue;if((D.deg.get(n.id)||0)<G.minDeg)continue;if((n.t||0)>cut)continue;if(fs&&!fs.has(n.id))continue;out.push(n);}
  if(G.typeOn.source)for(const d of S.docs){if((d.addedAt||0)>cut)continue;const dn=docNode(d);if(fs&&!fs.has(dn.id))continue;out.push(dn);}
  return out;
}
function rebuild(reheat=0.5){
  const vis=computeVisible();const ids=new Set(vis.map(n=>n.id));const links=[];const lc=new Map();const inc=id=>lc.set(id,(lc.get(id)||0)+1);
  for(const e of S.edges)if(ids.has(e.s)&&ids.has(e.t)){links.push({source:IDX.byId.get(e.s),target:IDX.byId.get(e.t),e});inc(e.s);inc(e.t);}
  if(G.typeOn.source)for(const n of vis){if(n.type==='source'||!n.docs)continue;for(const did of n.docs){const dn=DOCN.get(did);if(dn&&ids.has(dn.id))links.push({source:dn,target:n,e:null,mention:true});}}
  G.nodes=vis;G.links=links;G.visIds=ids;G.lc=lc;
  sim.force('link').links([]);sim.nodes(vis);applyForces();
  if(G.frozen){sim.stop();}else sim.alpha(Math.max(sim.alpha(),reheat)).restart();
  if(G.hover&&!ids.has(G.hover.id))G.hover=null;
  G.dirty=true;updateReadout();
}

/* ---------- drawing ---------- */
function resize(){
  const r=stage.getBoundingClientRect();G.w=Math.max(1,r.width);G.h=Math.max(1,r.height);G.dpr=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=Math.round(G.w*G.dpr);cv.height=Math.round(G.h*G.dpr);cv.style.width=G.w+'px';cv.style.height=G.h+'px';G.dirty=true;
}
function shapePath(c,shape,x,y,r){
  c.beginPath();
  switch(shape){
    case'diamond':{const q=r*1.25;c.moveTo(x,y-q);c.lineTo(x+q,y);c.lineTo(x,y+q);c.lineTo(x-q,y);c.closePath();break;}
    case'triangle':{const q=r*1.3;c.moveTo(x,y-q);c.lineTo(x+q*0.98,y+q*0.72);c.lineTo(x-q*0.98,y+q*0.72);c.closePath();break;}
    case'hex':{const q=r*1.12;for(let i=0;i<6;i++){const a=Math.PI/3*i;const px=x+q*Math.cos(a),py=y+q*Math.sin(a);if(i)c.lineTo(px,py);else c.moveTo(px,py);}c.closePath();break;}
    case'page':{const w=r*1.5,hh=r*1.95,f=r*0.55;c.moveTo(x-w/2,y-hh/2);c.lineTo(x+w/2-f,y-hh/2);c.lineTo(x+w/2,y-hh/2+f);c.lineTo(x+w/2,y+hh/2);c.lineTo(x-w/2,y+hh/2);c.closePath();break;}
    default:{const q=r*0.92;c.rect(x-q,y-q,q*2,q*2);}
  }
}
function emphasis(){
  if(G.path)return{mode:'path',nodes:G.path.set};
  const f=G.hover||G.sel;
  if(f){const set=new Set([f.id]);if(f.type==='source'){for(const n of S.nodes)if(n.docs.includes(f.docId))set.add(n.id);}else{for(const a of D.adj.get(f.id)||[])set.add(a.o);for(const d of f.docs||[])set.add('doc:'+d);}return{mode:'focus',nodes:set,f};}
  if(G.glow)return{mode:'glow',nodes:G.glow};
  if(G.qMatch)return{mode:'query',nodes:G.qMatch};
  return{mode:null,nodes:null};
}
function drawGrid(c,w,h,t){
  let step=40*t.k;while(step<20)step*=4;while(step>80)step/=4;
  const ox=((t.x%step)+step)%step,oy=((t.y%step)+step)%step;
  c.lineWidth=1;c.strokeStyle='rgba(120,150,190,0.05)';c.beginPath();
  for(let x=ox;x<w;x+=step){const X=Math.round(x)+.5;c.moveTo(X,0);c.lineTo(X,h);}
  for(let y=oy;y<h;y+=step){const Y=Math.round(y)+.5;c.moveTo(0,Y);c.lineTo(w,Y);}
  c.stroke();
  const big=step*4,bx=((t.x%big)+big)%big,by=((t.y%big)+big)%big;
  c.strokeStyle='rgba(127,216,255,0.2)';c.beginPath();
  for(let x=bx;x<w;x+=big)for(let y=by;y<h;y+=big){const X=Math.round(x)+.5,Y=Math.round(y)+.5;c.moveTo(X-3,Y);c.lineTo(X+4,Y);c.moveTo(X,Y-3);c.lineTo(X,Y+4);}
  c.stroke();
}
function arrow(c,l,col,k){
  const s=l.source,t=l.target;const dx=t.x-s.x,dy=t.y-s.y,len=Math.hypot(dx,dy)||1;const r=nodeR(t)+3/k;const ux=dx/len,uy=dy/len;const ax=t.x-ux*r,ay=t.y-uy*r;const sz=5/k;
  c.beginPath();c.moveTo(ax,ay);c.lineTo(ax-ux*sz*1.6-uy*sz,ay-uy*sz*1.6+ux*sz);c.lineTo(ax-ux*sz*1.6+uy*sz,ay-uy*sz*1.6-ux*sz);c.closePath();c.fillStyle=col;c.fill();
}
function drawScene(c,now,opt={}){
  const{w,h,dpr,t}=G;const k=t.k;const scale=opt.scale||dpr;
  c.setTransform(scale,0,0,scale,0,0);c.fillStyle=C.void;c.fillRect(0,0,w,h);
  drawGrid(c,w,h,t);
  const em=emphasis();const E=em.nodes;
  c.setTransform(scale*k,0,0,scale*k,scale*t.x,scale*t.y);
  const lw=1/k;
  const hot=[],inferred=[];
  c.lineWidth=lw;c.strokeStyle=E?'rgba(124,146,178,0.06)':'rgba(124,146,178,0.3)';c.beginPath();
  for(const l of G.links){if(l.mention)continue;const isHot=E&&(em.mode==='focus'?(l.source.id===em.f.id||l.target.id===em.f.id):(em.mode!=='path'&&E.has(l.source.id)&&E.has(l.target.id)));if(isHot){hot.push(l);continue;}if(l.e.inferred){inferred.push(l);continue;}c.moveTo(l.source.x,l.source.y);c.lineTo(l.target.x,l.target.y);}
  c.stroke();
  c.strokeStyle=E?'rgba(217,226,238,0.025)':'rgba(217,226,238,0.075)';c.setLineDash([2*lw,4*lw]);c.beginPath();
  for(const l of G.links){if(!l.mention)continue;if(em.mode==='focus'&&(l.source.id===em.f.id||l.target.id===em.f.id)){hot.push(l);continue;}c.moveTo(l.source.x,l.source.y);c.lineTo(l.target.x,l.target.y);}
  c.stroke();
  if(inferred.length){c.strokeStyle=E?'rgba(179,155,255,0.12)':'rgba(179,155,255,0.6)';c.setLineDash([5*lw,4*lw]);c.beginPath();for(const l of inferred){c.moveTo(l.source.x,l.source.y);c.lineTo(l.target.x,l.target.y);}c.stroke();}
  c.setLineDash([]);
  for(const l of hot){
    const col=l.mention?C.paper:colorOf(l.source===em.f?l.target:l.source);
    c.strokeStyle=rgba(col,l.mention?0.35:0.75);c.lineWidth=(l.mention?1:1.6)/k;
    if(l.mention||l.e.inferred)c.setLineDash([4/k,3/k]);
    c.beginPath();c.moveTo(l.source.x,l.source.y);c.lineTo(l.target.x,l.target.y);c.stroke();c.setLineDash([]);
    if(!l.mention)arrow(c,l,rgba(col,0.9),k);
  }
  if(G.path){
    const seq=G.path.seq;c.save();c.shadowColor=C.ice;c.shadowBlur=10;c.strokeStyle='#FFFFFF';c.lineWidth=2.4/k;c.beginPath();
    for(let i=0;i<seq.length-1;i++){const a=nodeById(seq[i]),b=nodeById(seq[i+1]);if(!a||!b||!G.visIds.has(a.id)||!G.visIds.has(b.id))continue;c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);}
    c.stroke();c.restore();
  }
  if(!REDUCED&&!opt.still){
    const flows=[];

function startRename(n){
  const t=$('#iTitle');if(!t)return;const inp=h('input',{class:'inp',value:n.label,'aria-label':'Node name',style:'font:600 18px var(--f-display);height:40px;margin-top:6px'});
  t.replaceWith(inp);inp.focus();inp.select();let done=false;
  const commit=()=>{if(done)return;done=true;const v=inp.value.trim().replace(/\s+/g,' ');if(!v||v===n.label){renderInspector();return;}
    const other=IDX.byKey.get(normKey(v));if(other&&other!==n.id){toast('A node with that name already exists. Use Merge to combine them.','error');renderInspector();return;}
    pushUndo('Rename '+n.label);if(!n.aliases.includes(n.label))n.aliases.push(n.label);n.label=v;n.aliases=n.aliases.filter(a=>normKey(a)!==normKey(v));structureChanged({reheat:0.05});};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done=true;renderInspector();}});

function evidenceFor(n,max=3){
  const terms=[n.label,...(n.aliases||[])].filter(t=>t&&t.length>=2).sort((a,b)=>b.length-a.length);let out='';let c=0;
  for(const did of n.docs||[]){
    if(c>=max)break;const d=IDX.doc.get(did);if(!d)continue;const txt=TEXTS.get(did);
    if(!txt){if(d.summary){out+=`<blockquote><cite>${esc(d.title)}</cite>${esc(clip(d.summary,240))}</blockquote>`;c++;}continue;}
    const lc=txt.toLowerCase();let at=-1,term='';
    for(const t of terms){const i=lc.indexOf(t.toLowerCase());if(i>=0){at=i;term=t;break;}}
    if(at<0){const w=n.label.split(/\s+/).filter(x=>x.length>4).sort((a,b)=>b.length-a.length)[0];if(w){at=lc.indexOf(w.toLowerCase());term=w;}}
    if(at<0)continue;
    const s=Math.max(0,txt.lastIndexOf(' ',Math.max(0,at-150))),e=Math.min(txt.length,at+term.length+200);
    const pre=txt.slice(s,at),mid=txt.slice(at,at+term.length),post=txt.slice(at+term.length,e);
    out+=`<blockquote><cite>${esc(d.title)}</cite>${s>0?'…':''}${esc(pre)}<mark>${esc(mid)}</mark>${esc(post)}${e<txt.length?'…':''}</blockquote>`;c++;
  }
  return out;

function localExtract(text){
  const clean=text.replace(/\s+/g,' ').slice(0,200000);
  const sents=clean.split(/(?<=[.!?])\s+/).filter(s=>s.length>20).slice(0,5000);
  const cand=new Map();
  const add=(name,startOnly)=>{name=name.trim().replace(/[.,;:]+$/,'');if(name.length<3||name.length>60)return;const k=normKey(name);if(!k)return;const w=k.split(' ');if(STOP.has(k)||STOP.has(w[0])||STOP.has(w[w.length-1]))return;let c=cand.get(k);if(!c){c={name,count:0,mid:0};cand.set(k,c);}c.count++;if(!startOnly)c.mid++;};
  const capRe=/\b([A-Z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)*(?:\s+(?:of\s+|for\s+|and\s+)?[A-Z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)*){0,3})/g;
  for(const s of sents){let m;capRe.lastIndex=0;while((m=capRe.exec(s))){add(m[1],m.index===0&&!m[1].includes(' '));}const acr=s.match(/\b[A-Z]{2,6}s?\b/g);if(acr)acr.forEach(a=>add(a.replace(/s$/,''),false));}
  const bi=new Map();
  for(const s of sents){const ws=s.toLowerCase().match(/[a-z][a-z\-]{2,}/g)||[];for(let i=0;i<ws.length-1;i++){if(STOP.has(ws[i])||STOP.has(ws[i+1]))continue;const b=ws[i]+' '+ws[i+1];bi.set(b,(bi.get(b)||0)+1);}}
  for(const[b,c]of bi)if(c>=3){const k=normKey(b);const ex=cand.get(k);if(ex)ex.count+=c;else cand.set(k,{name:titleCase(b),count:c,mid:c});}
  const lc=clean.toLowerCase();
  for(const n of S.nodes){const l=n.label.toLowerCase();if(l.length<4)continue;if(lc.includes(l)){const k=normKey(n.label);const ex=cand.get(k);if(ex){ex.count+=3;ex.name=n.label;ex.known=n;}else cand.set(k,{name:n.label,count:3,mid:3,known:n});}}
  const list=[...cand.values()].filter(c=>c.mid>0&&(c.count>=2||c.known)).map(c=>({...c,score:c.count*(c.name.includes(' ')?1.7:1)*(c.known?1.5:1)})).sort((a,b)=>b.score-a.score).slice(0,18);
  const ents=list.map(c=>{const s=sents.find(x=>x.toLowerCase().includes(c.name.toLowerCase()));return{name:c.name,type:c.known?c.known.type:guessType(c.name,clean),summary:s?clip(s,170):'',aliases:[]};});
  const keys=ents.map(e=>({e,re:new RegExp('\\b'+escRe(e.name.toLowerCase())+'\\b')}));const pair=new Map();
  for(const s of sents){const ls=s.toLowerCase();const present=keys.filter(k=>k.re.test(ls));for(let i=0;i<present.length;i++)for(let j=i+1;j<present.length;j++){const a=present[i].e.name,b=present[j].e.name;const pk=a<b?a+'\u0001'+b:b+'\u0001'+a;pair.set(pk,(pair.get(pk)||0)+1);}}
  const rels=[...pair.entries()].sort((a,b)=>b[1]-a[1]).slice(0,26).map(([pk,c])=>{const[a,b]=pk.split('\u0001');return{source:a,target:b,label:'co-occurs with',weight:Math.min(3,c)};});
  return{entities:ents,relations:rels,summary:clip(sents.slice(0,2).join(' '),300)};
}
function enqueueFiles(files){const list=[...files];if(!list.length)return;for(const f of list)ING.queue.push({file:f});log(`Queued ${list.length} file${list.length>1?'s':''}`);runQueue();}
async function runQueue(){
  if(ING.running)return;ING.running=true;updateIngestUI();
  while(ING.queue.length){const job=ING.queue.shift();try{await ingest(job);}catch(e){console.error(e);log('✕ '+(e.message||'Import failed'),'err');}}
  ING.running=false;updateIngestUI();renderDocs();G.dirty=true;
}
function updateIngestUI(){$('#stopIngest').hidden=!ING.running;}
$('#stopIngest').onclick=()=>{ING.queue.length=0;if(ING.ctl)ING.ctl.abort();log('Stopping import…','warn');};
async function ingest(job){
  const name=job.file?job.file.name:(job.title||'Pasted note');
  let doc;
  if(job.replace){
    doc=IDX.doc.get(job.replace);if(!doc)return;pushUndo('Re-map '+doc.title);
    S.nodes.forEach(n=>{n.docs=n.docs.filter(x=>x!==doc.id);});
    S.nodes=S.nodes.filter(n=>n.docs.length||n.manual||n.type==='gap');S.edges=S.edges.filter(e=>{e.docs=e.docs.filter(x=>x!==doc.id);return e.docs.length||e.manual||e.inferred;});
    doc.status='reading';structureChanged({reheat:0.2});
  }else{
    pushUndo('Ingest '+clip(name,40));
    doc={id:rid('d'),title:stripExt(name),file:name,kind:'notes',addedAt:Date.now(),summary:'',chars:0,status:'reading',method:''};
    const c=G.t.invert([G.w/2,G.h/2]);const ang=Math.random()*Math.PI*2;doc.x=c[0]+Math.cos(ang)*80;doc.y=c[1]+Math.sin(ang)*80;
    S.docs.push(doc);if(!G.typeOn.source){G.typeOn.source=true;}
    structureChanged({reheat:0.25});G.fresh.set('doc:'+doc.id,performance.now());
  }
  log(`▸ ${name}`);
  let text='',image=null;
  try{
    if(job.replace)text=TEXTS.get(doc.id)||'';
    else if(job.file){const r=await readAny(job.file,doc);doc.kind=r.kind||doc.kind;text=(r.text||'').replace(/\u0000/g,'').trim();image=r.image||null;if(r.title)doc.title=clip(r.title,120);}
    else{text=String(job.text||'').trim();doc.kind='notes';}
    if(!image&&text.length<40)throw new Error(job.file&&/pdf$/i.test(job.file.name)?'No text layer found. If this is a scanned PDF, upload page photos instead.':'Not enough readable text in this source.');
  }catch(e){doc.status='error';doc.error=e.message||String(e);log('  ✕ '+doc.error,'err');toast(`${clip(name,40)}: ${doc.error}`,'error');renderDocs();scheduleSave();return;}
  if(text){TEXTS.set(doc.id,text.slice(0,MAX_TEXT));doc.chars=text.length;PASS.delete(doc.id);log(`  read ${fmtNum(text.length)} characters`);}
  const sample=await aiReady();
  const canImage=!image||!!(CAP.limits&&CAP.limits.images);
  const before=S.nodes.length;
  const localPath=()=>{const res=localExtract(text);doc.method='local';const r=mergeExtraction(res,doc);r.added.forEach(id=>G.fresh.set(id,performance.now()));if(!doc.summary)doc.summary=res.summary;doc.status='local';log(`  local extraction: ${r.entities} terms, ${r.links} co-occurrence links`,'ok');structureChanged({reheat:0.6});};
  if(sample&&canImage){
    doc.status='extracting';doc.method='ai';ING.ctl=new AbortController();const signal=ING.ctl.signal;
    try{
      if(image){
        if(CAP.limits.images.maxInputBytes&&image.size>CAP.limits.images.maxInputBytes)throw{code:'image_rejected'};
        doc.progress='1/1';renderDocs();
        const res=await sample.json(imagePrompt(name),{images:[image],modelTier:tierFor()==='quick'?'default':tierFor(),signal});
        if(!res||typeof res!=='object')throw{code:'invalid_json'};
        if(res.transcript){const tx=String(res.transcript);TEXTS.set(doc.id,tx);doc.chars=tx.length;PASS.delete(doc.id);}
        applyResult(res,doc,0,1);
      }else{
        const{chunks,truncated,total}=chunkText(text,9000,chunkMax());
        if(truncated)log(`  long source: mapping ${chunks.length} of ${total} sections, evenly spaced`,'warn');
        for(let i=0;i<chunks.length;i++){
          doc.progress=`${i+1}/${chunks.length}`;renderDocs();
          const res=await sample.json(extractPrompt(name,chunks[i],i,chunks.length),{modelTier:tierFor(),signal});
          if(!res||typeof res!=='object'||!Array.isArray(res.entities))throw{code:'invalid_json'};
          applyResult(res,doc,i,chunks.length);
        }
      }
      doc.status='done';
    }catch(e){
      if(e&&e.code==='cancelled'){doc.status=S.nodes.some(n=>n.docs.includes(doc.id))?'partial':'error';doc.error='Stopped before mapping finished.';log('  stopped','warn');}
      else if(e&&FATAL_AI.includes(e.code)){noteAIFailure(e);log('  Claude unavailable; switching to local extraction','warn');if(text)localPath();else{doc.status='error';doc.error='Photo notes need Claude, which isn’t available in this view.';}}
      else{const has=S.nodes.some(n=>n.docs.includes(doc.id));doc.status=has?'partial':'error';doc.error=aiErr(e);log('  ✕ '+doc.error,'err');if(!has&&text){log('  falling back to local extraction','warn');localPath();doc.status='local';}else toast(doc.error,'error');}
    }finally{ING.ctl=null;}
  }else if(image){doc.status='error';doc.error=sample?'Photos can’t be sent to Claude in this view.':'Photo notes need Claude, which isn’t available in this view.';log('  ✕ '+doc.error,'err');toast(doc.error,'error');}
  else{localPath();}
  delete doc.progress;S.updatedAt=Date.now();
  const made=S.nodes.length-before;const total=D.docDeg.get('doc:'+doc.id)||S.nodes.filter(n=>n.docs.includes(doc.id)).length;
  structureChanged({reheat:0.3});
  if(doc.status!=='error'){log(`✓ ${clip(doc.title,48)}: ${total} nodes (${made} new)`,'ok');toast(`Mapped “${clip(doc.title,40)}” · ${total} nodes, ${made} new`,'ok',{label:'Show',fn:()=>{const dn=docNode(doc);enterFocus(dn);}});}
}
function applyResult(res,doc,i,n){
  if(i===0){if(res.title&&String(res.title).trim())doc.title=clip(String(res.title).trim(),120);if(res.kind&&/^(paper|notes|article|book|transcript|other)$/i.test(res.kind))doc.kind=String(res.kind).toLowerCase();if(res.summary)doc.summary=clip(String(res.summary).trim(),420);}
  const r=mergeExtraction(res,doc);const now=performance.now();r.added.forEach(id=>G.fresh.set(id,now));
  log(`  part ${i+1}/${n}: ${r.entities} entities, ${r.links} links, ${r.added.length} new`);
  structureChanged({reheat:0.55,save:false});
}

/* ---------- retrieval ---------- */
const PASS=new Map();
function passagesFor(id){
  if(PASS.has(id))return PASS.get(id);const t=TEXTS.get(id)||'';const sents=t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/);const out=[];let cur='';
  for(const s of sents){if(cur&&(cur.length+s.length)>700){out.push(cur.trim());cur='';}cur+=' '+s;}if(cur.trim())out.push(cur.trim());
  const res=out.slice(0,800).map((text,i)=>({docId:id,i,text,lc:text.toLowerCase()}));PASS.set(id,res);return res;
}
const tokenize=q=>uniq((q.toLowerCase().match(/[a-z0-9][a-z0-9\-]{2,}/g)||[]).filter(w=>!STOP.has(w)));
function searchPassages(terms,k=6){
  const all=[];for(const d of S.docs)all.push(...passagesFor(d.id));if(!all.length||!terms.length)return[];
  const df=new Map(terms.map(t=>[t,all.filter(p=>p.lc.includes(t)).length]));
  const scored=[];for(const p of all){let s=0;for(const t of terms){if(!df.get(t))continue;let c=0,i=p.lc.indexOf(t);while(i>=0&&c<6){c++;i=p.lc.indexOf(t,i+t.length);}if(c)s+=(1+Math.log(c))*Math.log(1+all.length/df.get(t));}if(s>0)scored.push([s,p]);}
  scored.sort((a,b)=>b[0]-a[0]);const out=[],per=new Map();for(const[,p]of scored){if((per.get(p.docId)||0)>=3)continue;per.set(p.docId,(per.get(p.docId)||0)+1);out.push(p);if(out.length>=k)break;}return out;
}
function retrieve(q){
  const terms=tokenize(q);const ql=q.toLowerCase();const scored=[];
  for(const n of S.nodes){const hay=(n.label+' '+(n.aliases||[]).join(' ')).toLowerCase();const sm=(n.summary||'').toLowerCase();let s=0;for(const t of terms){if(hay.includes(t))s+=3;else if(sm.includes(t))s+=1;}if(ql.includes(n.label.toLowerCase()))s+=8;for(const a of n.aliases||[])if(a.length>1&&new RegExp('\\b'+escRe(a.toLowerCase())+'\\b').test(ql))s+=6;if(s)scored.push([s+(D.deg.get(n.id)||0)*0.05,n]);}
  scored.sort((a,b)=>b[0]-a[0]);let seeds=scored.slice(0,8).map(x=>x[1]);
  if(!seeds.length)seeds=[...S.nodes].sort((a,b)=>(D.deg.get(b.id)||0)-(D.deg.get(a.id)||0)).slice(0,8);
  if(G.sel&&G.sel.type!=='source'&&!seeds.includes(G.sel))seeds.unshift(G.sel);
  const set=new Set(seeds.map(n=>n.id));
  for(const n of seeds.slice(0,5))for(const a of (D.adj.get(n.id)||[]).slice(0,8))set.add(a.o);
  const nodes=[...set].slice(0,30).map(id=>IDX.byId.get(id)).filter(Boolean);
  const edges=S.edges.filter(e=>set.has(e.s)&&set.has(e.t)).slice(0,70);
  const passages=searchPassages(uniq(terms.concat(seeds.slice(0,3).map(n=>n.label.toLowerCase()))),6);
  return{nodes,edges,passages};
}
const lbl=id=>IDX.byId.get(id)?.label||'?';

async function deepDive(n){
  const sample=await aiReady();if(!sample){toast('Claude isn’t available in this view.','error');return;}
  DEEP.id=n.id;DEEP.text='';DEEP.err='';DEEP.busy=true;DEEP.ctl=new AbortController();renderInspector();
  const conns=(D.adj.get(n.id)||[]).slice(0,24).map(a=>{const o=IDX.byId.get(a.o);return `- ${a.out?`${n.label} —${a.e.label}→ ${o.label}`:`${o.label} —${a.e.label}→ ${n.label}`} (${clip(o.summary,90)})`;}).join('\n');
  const ev=[];for(const did of n.docs||[]){const ps=searchPassages(tokenize(n.label+' '+(n.aliases||[]).join(' ')),12).filter(p=>p.docId===did).slice(0,1);ps.forEach(p=>ev.push(`[${docTitle(p.docId)}] ${clip(p.text,500)}`));if(ev.length>=4)break;}
  const prompt=`Write a compact study card about "${n.label}" for the reader, using their personal knowledge graph.

Node: ${n.label} (${n.type}): ${n.summary||'no summary yet'}
${n.aliases?.length?'Also called: '+n.aliases.join(', ')+'\n':''}${n.note?'Reader’s note: '+n.note+'\n':''}Connections in the graph:
${conns||'(none)'}
Excerpts from the reader's sources:
${ev.join('\n\n')||'(none)'}

Format as Markdown, max 170 words:
### What it is
Two sentences.
### How it connects
3 to 5 "- " bullets. Name connected nodes exactly as [[Exact Name]].
### Key insight
One sentence grounded in their sources; cite a source title as {{Source title}}. If there are no excerpts, use general knowledge and say so.
### Open questions
Two "- " bullets the reader could explore next.`;
  const id=n.id;
  try{
    const{text}=await sample(prompt,{signal:DEEP.ctl.signal,onText:({text})=>{if(DEEP.id!==id)return;DEEP.text=text;const o=$('#deepOut');if(o)o.innerHTML=md(text);}});
    DEEP.text=text;
  }catch(e){DEEP.err=e.code==='cancelled'?'':aiErr(e);if(e.text)DEEP.text=e.text;noteAIFailure(e);}
  DEEP.busy=false;DEEP.ctl=null;if(G.sel&&G.sel.id===id)renderInspector();
}

/* ---------- path ---------- */
const PATH={from:null,to:null,res:null,explain:'',busy:false,err:'',ctl:null,built:false};
function shortestPath(a,b){
  if(a===b)return[a];const prev=new Map([[a,null]]);const Q=[a];let qi=0;
  while(qi<Q.length){const v=Q[qi++];for(const x of D.adj.get(v)||[]){if(prev.has(x.o))continue;prev.set(x.o,v);if(x.o===b){const seq=[b];let c=v;while(c!=null){seq.unshift(c);c=prev.get(c);}return seq;}Q.push(x.o);}}
  return null;
}

function resolveField(which){const inp=$(which==='from'?'#pFrom':'#pTo');if(PATH[which]&&PATH[which].label===inp.value)return PATH[which];const m=matchNodes(inp.value,1);if(m[0]){PATH[which]=m[0].n;inp.value=m[0].n.label;return m[0].n;}return null;}
function tracePath(){
  const a=resolveField('from'),b=resolveField('to');
  if(!a||!b){toast('Pick both a start and an end node.','error');return;}
  if(a.type==='source'||b.type==='source'){toast('Paths run between ideas, not sources.','error');return;}
  const seq=shortestPath(a.id,b.id);PATH.explain='';PATH.err='';
  if(!seq){PATH.res={none:true,a,b};G.path=null;renderPathResult();G.dirty=true;return;}
  PATH.res={seq,a,b};G.path={seq,set:new Set(seq)};G.sel=null;
  if(seq.some(id=>!G.visIds.has(id))){if(G.focus){G.focus=null;$('#focusbar').hidden=true;}G.minDeg=0;$('#minDeg').value=0;$('#minDegVal').textContent='0';G.timeCut=Infinity;$('#tl').value=1000;for(const id of seq)G.typeOn[IDX.byId.get(id).type]=true;renderTypeChips();rebuild(0.3);}
  renderPathResult();G.dirty=true;setTimeout(()=>fitView(seq.map(nodeById).filter(Boolean),90),REDUCED?0:120);
}

function vaultDigest(maxNodes=150){

function hydrate(data){

    docs:(data.docs||[]).filter(d=>d&&d.id).map(d=>({...d,title:String(d.title||'Untitled'),status:okStatus.includes(d.status)?d.status:'partial',x:num(d.x),y:num(d.y)})),
    nodes:(data.nodes||[]).filter(n=>n&&n.id&&n.label).map(n=>{const o={id:n.id,label:String(n.label),type:TYPES[n.type]&&n.type!=='source'?n.type:'concept',summary:n.summary||'',aliases:Array.isArray(n.aliases)?n.aliases:[],docs:Array.isArray(n.docs)?n.docs:[],t:n.t||0,mentions:n.m||n.mentions||1,note:n.note||'',pinned:!!n.pinned,sample:!!n.sample,manual:!!n.manual,x:num(n.x),y:num(n.y)};if(o.pinned&&o.x!=null){o.fx=o.x;o.fy=o.y;}return o;}),

const LS_STATE='lattice.v1.state',LS_TEXT='lattice.v1.texts';let lsTextSig='';
function saveLocal(data){

  const sig=data.docs.map(d=>d.id+':'+(TEXTS.get(d.id)||'').length).join(',');if(sig===lsTextSig)return;
  try{const obj={};let total=0;for(const d of data.docs){const t=TEXTS.get(d.id);if(!t)continue;const s=t.slice(0,150000);if(total+s.length>3500000)break;obj[d.id]=s;total+=s.length;}localStorage.setItem(LS_TEXT,JSON.stringify(obj));lsTextSig=sig;}catch(e){}
}
function loadLocal(){try{const raw=localStorage.getItem(LS_STATE);if(!raw)return null;const data=JSON.parse(raw);let texts={};try{texts=JSON.parse(localStorage.getItem(LS_TEXT)||'{}');}catch(e){}return{data,texts};}catch(e){return null;}}
function setSync(s,label){const el=$('#sync');el.dataset.s=s;el.querySelector('span').textContent=label||{idle:'Sample',loading:'Loading',saving:'Saving',synced:'Synced',local:'This browser',full:'Storage full',retry:'Offline'}[s]||s;el.title={synced:'Saved to your Claude account',local:'Saved in this browser only',saving:'Saving changes',loading:'Loading your vault',full:'Account storage is full. Export to keep a copy.',idle:'The sample isn’t saved until you change it'}[s]||'';}

const WR=new Map();
const enc=new TextEncoder();
function capBytes(s,max){if(enc.encode(s).length<=max)return s;let lo=0,hi=s.length;while(lo<hi){const mid=(lo+hi+1)>>1;if(enc.encode(s.slice(0,mid)).length<=max)lo=mid;else hi=mid-1;}return s.slice(0,lo);}
function paginate(arr){const out=[];let cur=[],size=0;for(const it of arr){const s=enc.encode(JSON.stringify(it)).length+1;if(cur.length&&size+s>180000){out.push(cur);cur=[];size=0;}cur.push(it);size+=s;}if(cur.length||!out.length)out.push(cur);return out;}
async function putIfChanged(path,body){const s=JSON.stringify(body);if(WR.get(path)===s)return;await CAP.db.doc(path).set(body);WR.set(path,s);}
async function delDoc(path){try{await CAP.db.doc(path).delete();}catch(e){}WR.delete(path);}
async function writeVault(base,data){
  const np=paginate(data.nodes),ep=paginate(data.edges);
  for(let i=0;i<np.length;i++)await putIfChanged(base+'nodes-'+i,{items:np[i]});
  for(let i=0;i<ep.length;i++)await putIfChanged(base+'edges-'+i,{items:ep[i]});
  const prev=WR.get(base+'#counts');if(prev){const pc=JSON.parse(prev);for(let i=np.length;i<pc.n;i++)await delDoc(base+'nodes-'+i);for(let i=ep.length;i<pc.e;i++)await delDoc(base+'edges-'+i);}
  WR.set(base+'#counts',JSON.stringify({n:np.length,e:ep.length}));
  const ids=new Set(data.docs.map(d=>d.id));
  for(const d of data.docs){const p=base+'text-'+d.id;if(!WR.has(p)&&TEXTS.has(d.id)){await CAP.db.doc(p).set({text:capBytes(TEXTS.get(d.id),230000)});WR.set(p,'1');}}
  for(const p of [...WR.keys()])if(p.startsWith(base+'text-')&&!ids.has(p.slice((base+'text-').length)))await delDoc(p);
  await putIfChanged(base+'vault',{v:1,sample:data.sample,origin:data.origin==='showcase'&&base.startsWith('showcase')?'showcase':data.origin,docs:data.docs,updatedAt:data.updatedAt,nodePages:np.length,edgePages:ep.length});
}
async function readVault(base){
  const m=await CAP.db.doc(base+'vault').get();if(!m.exists)return null;const meta=m.data();
  const nodes=[],edges=[];
  const np=Math.min(200,meta.nodePages||0),ep=Math.min(200,meta.edgePages||0);
  const gets=[];for(let i=0;i<np;i++)gets.push(CAP.db.doc(base+'nodes-'+i).get().then(s=>({k:'n',i,s})));for(let i=0;i<ep;i++)gets.push(CAP.db.doc(base+'edges-'+i).get().then(s=>({k:'e',i,s})));
  const res=await Promise.all(gets);res.sort((a,b)=>a.i-b.i);
  for(const r of res){if(!r.s.exists)continue;const body=r.s.data();WR.set(base+(r.k==='n'?'nodes-':'edges-')+r.i,JSON.stringify(body));(r.k==='n'?nodes:edges).push(...(body.items||[]));}
  WR.set(base+'#counts',JSON.stringify({n:np,e:ep}));WR.set(base+'vault',JSON.stringify(meta));
  return{data:{...meta,nodes,edges},base};
}
async function loadTexts(base,docs){
  for(const d of docs){if(TEXTS.has(d.id))continue;try{const s=await CAP.db.doc(base+'text-'+d.id).get();if(s.exists){const t=s.data().text;if(typeof t==='string'){TEXTS.set(d.id,t);PASS.delete(d.id);if(base.startsWith('data/'))WR.set(base+'text-'+d.id,'1');}}}catch(e){}}
  if(G.sel)renderInspector();
}
async function saveNow(){
  if(!S||S.pristine)return;if(saving){saveAgain=true;return;}saving=true;
  try{
    do{saveAgain=false;const data=serialize();saveLocal(data);
      if(CAP.db&&CAP.uid&&!CAP.dbRO){setSync('saving');await writeVault('data/users/'+CAP.uid+'/',data);setSync('synced');}
      else setSync('local');
    }while(saveAgain);
  }catch(e){
    const code=e&&e.code;
    if(e instanceof TypeError||code==='invalid_argument'||code==='not_granted'||code==='revoked'){CAP.dbRO=true;setSync('local');log('This page can’t store data in your account here; saving in this browser.','warn');}
    else if(code==='quota_exceeded'){setSync('full');toast('Account storage is full. Export your vault to keep a copy.','error');}
    else{setSync('retry');if(!saveNow.retried){saveNow.retried=true;setTimeout(()=>{saveNow.retried=false;scheduleSave();},8000+Math.random()*4000);}}
  }finally{saving=false;}
}
window.addEventListener('pagehide',()=>{if(S&&!S.pristine)saveLocal(serialize());});
function applyLoaded(data,texts,origin){

}
