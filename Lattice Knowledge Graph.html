/* ---------- timeline + replay ---------- */
function tlBounds(){let min=Infinity,max=-Infinity;for(const d of S.docs){if(d.addedAt){min=Math.min(min,d.addedAt);max=Math.max(max,d.addedAt);}}for(const n of S.nodes){if(n.t){min=Math.min(min,n.t);max=Math.max(max,n.t);}}return isFinite(min)?{min,max}:null;}
function cutFor(v){const b=tlBounds();if(!b||v>=1000)return Infinity;return b.min+(b.max-b.min)*v/1000;}
function updateTimelineLabel(){const v=+$('#tl').value;const cut=G.timeCut;let n=0;for(const x of S.nodes)if((x.t||0)<=cut)n++;$('#tlLabel').textContent=(v>=1000||cut===Infinity)?`All · ${n}`:`${fmtDate(cut)} · ${n}`;}
function applyTimeline(v){const cut=cutFor(v);const before=G.timeCut;G.timeCut=cut;let changed=false;for(const n of S.nodes){const a=(n.t||0)<=before,b=(n.t||0)<=cut;if(a!==b){changed=true;if(b)G.fresh.set(n.id,performance.now());}}for(const d of S.docs){const a=(d.addedAt||0)<=before,b=(d.addedAt||0)<=cut;if(a!==b)changed=true;}if(changed)rebuild(0.45);updateTimelineLabel();}
$('#tl').addEventListener('input',e=>{if(G.replay)stopReplay();applyTimeline(+e.target.value);});
function toggleReplay(){
  if(G.replay){stopReplay();return;}const b=tlBounds();if(!b||b.min===b.max){toast('Add sources on different days to replay how your graph grew.');return;}
  if(G.focus){G.focus=null;$('#focusbar').hidden=true;}G.sel=null;G.path=null;
  G.replay={start:performance.now(),dur:REDUCED?1:9000};$('#tl').value=0;applyTimeline(0);$('#replayBtn').innerHTML=ico('pause');$('#replayBtn').setAttribute('aria-label','Pause replay');
  setTimeout(()=>fitView(S.nodes.length?[...S.nodes,...S.docs.map(docNode)]:G.nodes,70),50);
}
function stepReplay(now){const r=G.replay;const p=Math.min(1,(now-r.start)/r.dur);const v=Math.round(p*1000);$('#tl').value=v;applyTimeline(v);if(p>=1)stopReplay();}
function stopReplay(){G.replay=null;$('#replayBtn').innerHTML=ico('play');$('#replayBtn').setAttribute('aria-label','Replay growth');}
$('#replayBtn').onclick=toggleReplay;

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const tg=e.target;const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable;
  if(e.key==='Escape'){
    if(!modalEl.hidden){e.preventDefault();closeModal();return;}
    if(!ctxEl.hidden){e.preventDefault();closeCtx();return;}
    if(typing){tg.blur();return;}
    if(G.replay){stopReplay();return;}
    if(G.path){clearPath();return;}
    if(G.glow){G.glow=null;G.dirty=true;return;}
    if(G.focus){exitFocus();return;}
    if(G.sel){select(null,{tab:false});return;}
    if(G.qMatch){G.qMatch=null;searchIn.value='';G.dirty=true;}
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchIn.focus();return;}
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();undo();return;}
  if(typing||e.metaKey||e.ctrlKey||e.altKey||!modalEl.hidden)return;
  if(tg.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  switch(e.key){
    case'/':e.preventDefault();searchIn.focus();break;
    case'f':case'F':fitView();break;
    case'l':case'L':{const o=['auto','all','none'];G.labels=o[(o.indexOf(G.labels)+1)%3];renderControls();G.dirty=true;savePrefs();toast('Labels: '+{auto:'auto',all:'all',none:'off'}[G.labels]);break;}
    case'c':case'C':{const o=['type','cluster','source'];G.colorBy=o[(o.indexOf(G.colorBy)+1)%3];renderControls();renderLegend();renderDocs();G.dirty=true;savePrefs();toast('Color by '+G.colorBy);break;}
    case'd':case'D':G.typeOn.source=!G.typeOn.source;renderTypeChips();rebuild(0.3);break;
    case' ':e.preventDefault();toggleFreeze();break;
    case'p':case'P':if(G.sel&&G.sel.type!=='source')togglePin(G.sel);break;
    case'r':case'R':toggleReplay();break;
    case'?':openHelp();break;
    case'1':case'2':case'3':case'4':showTab(TABS[+e.key-1]);break;
    case'Delete':case'Backspace':if(G.sel){e.preventDefault();if(G.sel.type==='source')removeDoc(IDX.doc.get(G.sel.docId));else deleteNode(G.sel);}break;
  }
});

/* ---------- boot ---------- */
resize();new ResizeObserver(()=>{const oldW=G.w,oldH=G.h;resize();if(oldW>1&&(Math.abs(oldW-G.w)>1||Math.abs(oldH-G.h)>1)){G.t=G.t.translate((G.w-oldW)/2/G.t.k,(G.h-oldH)/2/G.t.k);d3.select(cv).property('__zoom',G.t);}}).observe(stage);
renderControls();
const local=loadLocal();
if(local&&local.data&&Array.isArray(local.data.nodes)){applyLoaded(local.data,local.texts,local.data.origin);S.pristine=false;setSync('local');log(`Restored ${S.nodes.length} nodes from this browser`);}
else{S=buildSample();reindex();derive();rebuild(1);sim.tick(220);renderAll();d3.select(cv).call(G.zoom.transform,d3.zoomIdentity.translate(G.w/2,G.h/2));fitView(G.nodes,60,0);setSync('idle');log('Loaded the sample vault: 6 sources, '+S.nodes.length+' nodes');}
requestAnimationFrame(loop);
updateIngestUI();

(async()=>{
  const s=await CAPP.sample;CAP.sample=s;
  if(s){try{CAP.limits=await s.limits();}catch(e){CAP.limits=null;}setAI(true);log('Claude connected for extraction and analysis','ok');}
  else{setAI(false);log('Claude unavailable here; using local extraction','warn');}
})();
use('downloads').then(d=>{CAP.downloads=d;});
use('tts').then(t=>{CAP.tts=t;if(t){t.onState(({state})=>{ttsState=state;updateSpeakButtons();});}updateSpeakButtons();});
use('dictation').then(d=>{CAP.dict=d;setupDictation();});
(async()=>{
  const[user,db]=await Promise.all([use('user'),use('db')]);CAP.user=user;CAP.db=db;
  if(user){try{CAP.uid=await user.id();}catch(e){}try{CAP.isOwner=!!(await user.isOwner());}catch(e){}}
  if(!db||!CAP.uid){if(S.pristine)setSync('idle');else setSync('local');return;}
  setSync('loading');
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
  try{
    const base='data/users/'+CAP.uid+'/';
    const mine=await withTimeout(readVault(base),12000);
    let sc=null;try{const m=await withTimeout(CAP.db.doc('showcase/vault').get(),8000);if(m.exists){CAP.showcaseAt=m.data().updatedAt||Date.now();sc=true;}}catch(e){}
    if(mine&&(S.pristine||(mine.data.updatedAt||0)>=(S.updatedAt||0))){
      applyLoaded(mine.data,null,mine.data.origin);setSync('synced');log(`Synced ${S.nodes.length} nodes from your account`,'ok');loadTexts(base,S.docs);
    }else if(!mine&&sc&&!CAP.isOwner&&S.pristine){
      const show=await withTimeout(readVault('showcase/'),12000);
      if(show){applyLoaded(show.data,null,'showcase');S.pristine=true;S.origin='showcase';renderBanner();setSync('idle','Showcase');log('Opened the published showcase','ok');loadTexts('showcase/',S.docs);}
    }else if(!S.pristine){scheduleSave();}
    else setSync('idle');
  }catch(e){setSync(S.pristine?'idle':'local');log('Account sync unavailable; saving in this browser.','warn');}
})();
})();
</script>

</body></html>
